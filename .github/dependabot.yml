version: 2
# Keep `labels` unset: Dependabot creates and applies its managed
# `dependencies` and ecosystem labels when custom overrides are absent.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: scope

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build"
      include: scope
