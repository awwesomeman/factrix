name: docs-deploy-dev

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'factrix/**'
      - 'scripts/**'
      - 'examples/**'
      - '.github/workflows/docs-deploy-dev.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'factrix/**'
      - 'scripts/**'
      - 'examples/**'
      - '.github/workflows/docs-deploy-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.x"
          enable-cache: true

      # mkdocstrings caches each intersphinx inventory for one day, but at
      # platformdirs.user_cache_dir("mkdocs") rather than the mkdocs cache_dir
      # setting, so setup-uv's enable-cache does not cover it and every run
      # would otherwise fetch (#1042). The key rotates daily to match that TTL:
      # a fixed key would be restored past its expiry, re-downloaded anyway,
      # and never re-saved, which is the same as having no cache from day two.
      - name: Inventory cache key
        id: inventory-cache-key
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore mkdocs inventory cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/mkdocs
          key: mkdocs-inventories-${{ runner.os }}-${{ steps.inventory-cache-key.outputs.day }}

      - name: Install docs dependencies
        run: uv sync --frozen --python 3.12 --extra docs

      - name: Strict build
        run: uv run mkdocs build --strict

      - name: Check generated docs files are committed
        run: |
          git diff --exit-code -- \
            docs/examples/multi_factor_screening.md \
            docs/examples/stock_factor_evaluation.md \
            docs/reference/_generated_metric_matrix.md \
            docs/reference/_generated_metric_name_index.md \
            docs/reference/_generated_warning_codes.md

  build-main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.x"
          enable-cache: true

      # mkdocstrings caches each intersphinx inventory for one day, but at
      # platformdirs.user_cache_dir("mkdocs") rather than the mkdocs cache_dir
      # setting, so setup-uv's enable-cache does not cover it and every run
      # would otherwise fetch (#1042). The key rotates daily to match that TTL:
      # a fixed key would be restored past its expiry, re-downloaded anyway,
      # and never re-saved, which is the same as having no cache from day two.
      - name: Inventory cache key
        id: inventory-cache-key
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore mkdocs inventory cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/mkdocs
          key: mkdocs-inventories-${{ runner.os }}-${{ steps.inventory-cache-key.outputs.day }}

      - name: Install docs dependencies
        run: uv sync --frozen --python 3.12 --extra docs

      - name: Strict build
        run: uv run mkdocs build --strict

      - name: Check generated docs files are committed
        run: |
          git diff --exit-code -- \
            docs/examples/multi_factor_screening.md \
            docs/examples/stock_factor_evaluation.md \
            docs/reference/_generated_metric_matrix.md \
            docs/reference/_generated_metric_name_index.md \
            docs/reference/_generated_warning_codes.md
