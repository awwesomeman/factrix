name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.x"
          enable-cache: true

      - name: Install dev tooling
        run: uv sync --frozen --python 3.12 --all-extras

      # Same command contributors' commit hook runs, so CI and local
      # cannot drift: ruff check + ruff format --check, both gating.
      - name: pre-commit (ruff check + ruff format --check)
        run: uv run pre-commit run --all-files --hook-stage pre-commit

      # Push-time gate locally (scripts/hooks/pre-push); a job step here.
      - name: mypy
        run: uv run mypy factrix

  test:
    name: pytest (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Three BLAS / filesystem / timezone stacks: OpenBLAS (Linux),
        # Accelerate (macOS arm64), and Windows (no system IANA tz database).
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.x"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python }} --all-extras

      - name: Run pytest
        run: uv run --python ${{ matrix.python }} pytest

  dev-extra:
    name: pytest (documented contributor setup, --extra dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.x"
          enable-cache: true

      # The contributing guides tell a new contributor to install exactly this
      # and then run the complete suite. #1061: the docs-site tests need the
      # separate ``docs`` extra, so this job proves they skip with a reason
      # instead of failing the advertised command. ``-rs`` puts each reason in
      # the log, so an extra that quietly stopped being installed is visible.
      # This job passes on the tree as it stands: it pins the documented
      # setup against drift — a newly collected test importing a docs-only
      # dependency — rather than proving a fix.
      - name: Install the documented contributor environment
        run: uv sync --frozen --python 3.12 --extra dev

      - name: Run pytest
        run: uv run --python 3.12 pytest -rs

  docs-no-theme:
    name: pytest (docs machinery, no theme)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.x"
          enable-cache: true

      # This intentionally constructs the one dependency boundary no declared
      # extra represents: mkdocstrings is importable but mkdocs-material is
      # absent. It proves the false direction of ``requires_theme``; the
      # all-extras matrix above proves the two marked tests run with the theme.
      - name: Install docs machinery without the theme
        shell: bash
        run: |
          uv sync --frozen --python 3.12 --extra dev
          uv pip install --python .venv \
            "mkdocstrings==1.0.4" "mkdocstrings-python==2.0.3"
          .venv/bin/python - <<'PY'
          import importlib.metadata
          import importlib.util

          assert importlib.util.find_spec("mkdocstrings") is not None
          try:
              importlib.metadata.version("mkdocs-material")
          except importlib.metadata.PackageNotFoundError:
              pass
          else:
              raise AssertionError("mkdocs-material must be absent in this CI cell")
          PY

      - name: Assert the requires_theme skips
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output=$(uv run --python 3.12 pytest -q -rs --color=no \
            tests/test_docs_inventory_cache_warmup.py 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 0
          grep -Fq "19 passed, 2 skipped" <<<"$output"
          reason="resolving mkdocs.yml requires mkdocs-material from the docs extra"
          grep -Fq "$reason" <<<"$output"

  floor:
    name: pytest (declared dependency floor, no pandas, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.x"
          enable-cache: true

      # The lockfile hides the declared floor entirely; this job installs the
      # minimum engine versions from pyproject and deliberately omits the
      # ``pandas`` extra so the polars-native base install is proven to
      # import and test without pandas or pyarrow present.
      - name: Install floor dependencies
        shell: bash
        run: |
          uv venv --python 3.12 .venv-floor
          uv pip install --python .venv-floor \
            "polars==1.38.1" "numpy==2.0.2" "scipy==1.13.1" \
            "pytest==9.1.1" "pytest-mock==3.15.1" "tzdata>=2025.1" -e .

      - name: Run pytest
        shell: bash
        run: uv run --python .venv-floor --no-project pytest -q

  doctest:
    name: pytest --doctest-modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.x"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.12 --all-extras

      - name: Run doctests
        run: uv run pytest --doctest-modules factrix/

  # examples job paused — examples/*.ipynb were deleted alongside #447 because
  # they demoed the FactorProfile-era API (factor_id stamping, dataclasses.replace
  # escape hatch, Survivors container) that retires under v0.14.0. Re-enable
  # this job once fresh EvaluationResult-shaped notebooks land under examples/.
  #
  # examples:
  #   name: example notebooks execute
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@v7
  #
  #     - name: Install uv
  #       uses: astral-sh/setup-uv@v7
  #       with:
  #         version: "0.8.x"
  #         enable-cache: true
  #
  #     - name: Install dependencies
  #       run: uv sync --frozen --python 3.12 --all-extras
  #
  #     - name: Execute examples/*.ipynb
  #       run: |
  #         set -euo pipefail
  #         shopt -s nullglob
  #         notebooks=(examples/*.ipynb)
  #         if [ ${#notebooks[@]} -eq 0 ]; then
  #           echo "No notebooks found under examples/" >&2
  #           exit 1
  #         fi
  #         for nb in "${notebooks[@]}"; do
  #           echo "::group::$nb"
  #           uv run jupyter nbconvert --to notebook --execute "$nb" --output-dir /tmp
  #           echo "::endgroup::"
  #         done

  build:
    name: wheel build + import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.x"
          enable-cache: true

      - name: Build wheel + sdist
        run: uv build --python 3.12

      - name: Import-from-wheel smoke
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python --quiet dist/factrix-*.whl
          /tmp/smoke/bin/python -c "
          import factrix as fl
          import importlib.resources as ir
          assert fl.__version__
          assert ir.files('factrix').joinpath('llms-full.txt').is_file()
          assert ir.files('factrix').joinpath('llms.txt').is_file()
          print(f'OK factrix {fl.__version__}; llms-full.txt shipped in wheel')
          "
