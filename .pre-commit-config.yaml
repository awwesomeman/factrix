# pre-commit framework config — the single hook surface for this repo.
#
# Install once per clone (or let ``python scripts/setup_dev.py`` do it):
#
#     uv run pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
#
# Version sync rule: the ``rev`` below must match the ``ruff==`` pin in
# ``pyproject.toml``'s ``dev`` extra. The pyproject pin is the source of
# truth — CI, editors and ``uv run ruff`` all resolve from it. Bump both
# together (``uv run pre-commit autoupdate`` moves ``rev`` only);
# ``tests/test_precommit_ruff_pin.py`` fails when the two diverge.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      # Both hooks gate rather than rewrite: no ``--fix`` on the check
      # hook and ``--check`` on the formatter, so a hook run never
      # mutates files under the committer's feet. Fix commands are in
      # the failure output ruff prints. Scope is ruff's own
      # ``types_or: [python, pyi, jupyter]`` default — .py / .ipynb.
      - id: ruff-check
        stages: [pre-commit]
      - id: ruff-format
        args: [--check]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: no-claude-coauthor-trailer
        name: "reject Co-Authored-By: Claude trailers"
        entry: scripts/hooks/commit-msg
        language: script
        stages: [commit-msg]

      - id: push-gates
        name: CHANGELOG polish + mkdocs --strict + mypy
        entry: scripts/hooks/pre-push
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true
