# pre-commit framework config — the single hook surface for this repo.
#
# Install once per clone (or let ``python scripts/setup_dev.py`` do it):
#
#     uv run pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
#
# Ruff runs as a local hook through ``uv run`` so its version is whatever
# ``uv.lock`` resolves from the ``ruff==`` pin in ``pyproject.toml`` -- the
# one place Dependabot bumps. A ``ruff-pre-commit`` repo ``rev`` would be a
# second copy of that version that Dependabot's uv ecosystem never updates.
repos:
  - repo: local
    hooks:
      # Both hooks gate rather than rewrite: no ``--fix`` on the check
      # hook and ``--check`` on the formatter, so a hook run never
      # mutates files under the committer's feet. Fix commands are in
      # the failure output ruff prints. Scope matches ruff-pre-commit's
      # own ``types_or`` default -- .py / .pyi / .ipynb.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]

      - id: no-claude-coauthor-trailer
        name: "reject Co-Authored-By: Claude trailers"
        entry: scripts/hooks/commit-msg
        language: script
        stages: [commit-msg]

      - id: push-gates
        name: CHANGELOG polish + mkdocs --strict + mypy
        entry: scripts/hooks/pre-push
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true
